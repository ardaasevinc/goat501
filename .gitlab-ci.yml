# keci501.com — GitLab CI/CD (k8s-01). Pipeline, Dockerfile ve Kubernetes dosyaları ortak şablondan:
# selquor/ci-sablon (laravel.yml). Projeye özel bir dosya gerekirse aynı adla buraya eklenir.
include:
  - {project: selquor/ci-sablon, ref: main, file: laravel.yml}

variables:
  APP: keci501
  HOST: keci501.com
  TESTHOST: keci501test.selquor.com
  MOTOR: mysql
  WWW: "1"
  TEST_ZORUNLU: "0"
